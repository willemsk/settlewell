[project]
name = "settlewell"
version = "0.1.0"
description = "Ground settlement calculation for dewatering of construction pits"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.15",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.0", "ipykernel>=6.0"]
test = ["pytest>=7.0"]
web = [
    "solara>=1.60.3",
    "pydantic>=2.13.4",
    "ipycanvas>=0.14.3",
    "anywidget>=0.9.0",
    "reportlab>=5.0.0",
    "ezdxf>=1.4.4",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.gui-scripts]
settlewell-web = "settlewell.solara_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/settlewell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (grid refinement, convergence loops). Deselect with: pytest -m 'not slow'",
]

[tool.ruff]
target-version = "py311"
exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]



