[project]
name = "settlewell"
version = "0.1.0"
description = "Ground settlement calculation for dewatering of construction pits"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.15",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
notebook = ["jupyter>=1.0", "ipykernel>=6.0"]
test = ["pytest>=7.0"]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.gui-scripts]
settlewell-gui = "settlewell.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (grid refinement, convergence loops). Deselect with: pytest -m 'not slow'",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]


