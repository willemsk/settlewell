name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - solara-gui

jobs:
  build-docker:
    name: Build & Test Solara Docker Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: settlewell-solara:latest
